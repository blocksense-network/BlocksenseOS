name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Stage 1: Code Quality & Security Baseline
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    outputs:
      changes-detected: ${{ steps.changes.outputs.any }}
    defaults:
      run:
        shell: "${{ github.workspace }}/scripts/nix-env.sh {0}"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with:
        fetch-depth: 0

    - name: Detect changes
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v2
      id: changes
      with:
        base: main
        filters: |
          nix:
            - '**/*.nix'
            - 'flake.lock'
            - 'flake.nix'
          rust:
            - '**/Cargo.toml'
            - '**/Cargo.lock'
            - '**/*.rs'
          cpp:
            - '**/*.cpp'
            - '**/*.h'
            - '**/CMakeLists.txt'
          docs:
            - '**/*.md'
            - 'docs/**'
          ci:
            - '.github/workflows/**'
          any:
            - '**'

    - uses: ./.github/actions/setup-nix
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        substituters: ${{ vars.SUBSTITUTERS }}
        trusted_public_keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

    - name: Run code quality checks
      run: just ci-code-quality

    - name: Secret scanning (Pull Request)
      if: github.event_name == 'pull_request'
      uses: trufflesecurity/trufflehog@190f454a674bca31607f376bf19ba8692f155d9f # main
      with:
        path: ./
        base: ${{ github.event.pull_request.base.sha }}
        head: ${{ github.event.pull_request.head.sha }}
        extra_args: --debug --only-verified

    - name: Secret scanning (Push to main/develop)
      if: github.event_name == 'push'
      uses: trufflesecurity/trufflehog@190f454a674bca31607f376bf19ba8692f155d9f # main
      with:
        path: ./
        base: HEAD~1
        head: HEAD
        extra_args: --debug --only-verified

    - name: Generate SBOM
      run: just security-sbom

    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: sbom-reports
        path: security/sbom/
        retention-days: 30

  # Stage 2: Build Matrix
  build-matrix:
    name: Build All Components
    runs-on: ubuntu-latest
    needs: code-quality
    if: needs.code-quality.outputs.changes-detected == 'true'
    strategy:
      matrix:
        component: [cpp-echo-service, rust-echo-service, attestation-agent, derivation-hasher, rust-client]
      fail-fast: false
    defaults:
      run:
        shell: "${{ github.workspace }}/scripts/nix-env.sh {0}"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with:
        fetch-depth: 0

    - uses: ./.github/actions/setup-nix
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        substituters: ${{ vars.SUBSTITUTERS }}
        trusted_public_keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

    - name: Build ${{ matrix.component }}
      run: nix build .#${{ matrix.component }} -o build/${{ matrix.component }}

    - name: Test ${{ matrix.component }} basic functionality
      run: |
        set -euo pipefail

        # Disable core dumps. A crashing binary that is slow to dump core can
        # still be dying when `timeout` fires, which would be reported as 124
        # (the healthy code) instead of 128+signal. With core dumps off, a
        # crash is reported immediately and honestly.
        ulimit -c 0

        component="${{ matrix.component }}"
        bin="./build/$component/bin/$component"

        test -x "$bin"

        case "$component" in
          "attestation-agent")            kind=service; limit=10 ;;
          "rust-echo-service"|"cpp-echo-service") kind=service; limit=5 ;;
          *)                              kind=cli ;;
        esac

        if [ "$kind" = "service" ]; then
          # These components are long-running servers. The healthy outcome is
          # that the process is STILL ALIVE when `timeout` kills it, which GNU
          # timeout reports as exit code 124. Any other status means the
          # process exited on its own before the deadline -- it crashed, or it
          # failed to start (bad port, missing library, panic) -- and that is
          # exactly the breakage this step is supposed to catch.
          echo "=== $component: expecting it to stay alive for ${limit}s ==="
          if timeout "${limit}s" "$bin"; then
            status=0
          else
            status=$?
          fi

          if [ "$status" -eq 124 ]; then
            echo "OK: $component was still running after ${limit}s and was killed by timeout"
          else
            echo "FAIL: $component exited on its own with status $status before the ${limit}s deadline."
            echo "      A healthy service would still have been running. Status 124 is the pass condition;"
            echo "      128+N indicates death by signal N (139 = SIGSEGV)."
            exit 1
          fi
        else
          # These components are one-shot CLIs: --help must succeed.
          echo "=== $component: expecting '--help' to exit 0 ==="
          if "$bin" --help; then
            status=0
          else
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo "OK: $component --help exited 0"
          else
            echo "FAIL: $component --help exited with status $status"
            exit 1
          fi
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ matrix.component }}-binary
        path: build/${{ matrix.component }}/
        retention-days: 7

  # Stage 3: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        project: [attestation-agent, services/rust-echo, clients/rust-client, derivation-hasher]
    defaults:
      run:
        shell: "${{ github.workspace }}/scripts/nix-env.sh {0}"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with:
        fetch-depth: 0

    - uses: ./.github/actions/setup-nix
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        substituters: ${{ vars.SUBSTITUTERS }}
        trusted_public_keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

    - name: Run unit tests for ${{ matrix.project }}
      run: |
        cd ${{ matrix.project }}
        cargo test --verbose

    - name: Run property-based tests
      run: |
        cd ${{ matrix.project }}
        cargo test --verbose --release -- --ignored

    - name: Generate test coverage
      run: |
        set -euo pipefail
        cd ${{ matrix.project }}

        # cargo-tarpaulin comes from the dev shell (flake.nix). It used to be
        # `cargo install`ed here at runtime, which (a) fetched from crates.io
        # in the middle of a Nix-pinned build and (b) has been failing outright
        # -- `cargo-platform` now requires rustc 1.91 and the pinned toolchain
        # is 1.86 -- leaving `cargo tarpaulin` as "no such command". Both
        # failures were swallowed, so no coverage was ever produced and the
        # uploaded number was fictional.
        cargo tarpaulin --out Xml

        # Producing the report is the point of this step; if the file is not
        # there, the step has not done its job.
        test -f cobertura.xml
        echo "OK: coverage report generated for ${{ matrix.project }}"

    # Deliberately advisory: this uploads to a third-party service, so an
    # outage or a rate limit on codecov.io should not fail the build. The
    # assertion that matters -- that coverage was actually measured and the
    # report exists -- is made in the step above, where it belongs.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        file: ${{ matrix.project }}/cobertura.xml
        flags: ${{ matrix.project }}
        name: codecov-${{ matrix.project }}
        fail_ci_if_error: false

  # Stage 4: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-matrix]
    defaults:
      run:
        shell: "${{ github.workspace }}/scripts/nix-env.sh {0}"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with:
        fetch-depth: 0

    - uses: ./.github/actions/setup-nix
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        substituters: ${{ vars.SUBSTITUTERS }}
        trusted_public_keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

    - name: Download build artifacts
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
      with:
        path: build
        merge-multiple: true

    - name: Make binaries executable
      run: |
        set -euo pipefail

        # Every component built by the build-matrix job must have arrived via
        # the artifact download. A missing binary used to be silent here and
        # then surfaced later as a confusing integration-test failure.
        expected=(
          attestation-agent
          cpp-echo-service
          derivation-hasher
          rust-client
          rust-echo-service
        )

        missing=()
        for name in "${expected[@]}"; do
          if [ ! -f "build/bin/$name" ]; then
            missing+=("build/bin/$name")
          fi
        done

        if [ "${#missing[@]}" -ne 0 ]; then
          echo "FAIL: expected binaries are missing from the downloaded artifacts:"
          printf '  %s\n' "${missing[@]}"
          echo "What was actually downloaded:"
          if [ -d build ]; then
            find build -maxdepth 3 -mindepth 1 | sort
          else
            echo "  (no 'build' directory at all)"
          fi
          exit 1
        fi

        chmod +x build/bin/*
        ls -la build/bin/

    - name: Run integration tests
      run: just test-integration

    - name: Cleanup background processes
      if: always()
      run: |
        echo "=== Cleaning up background processes ==="
        # Kill any remaining processes by name
        pkill -f "attestation-agent" || true
        pkill -f "cpp-echo-service" || true
        pkill -f "rust-echo-service" || true
        echo "✓ Cleanup complete"

  # Stage 5: System Tests
  system-tests:
    name: VM and System Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    defaults:
      run:
        shell: "${{ github.workspace }}/scripts/nix-env.sh {0}"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with:
        fetch-depth: 0

    - uses: ./.github/actions/setup-nix
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        substituters: ${{ vars.SUBSTITUTERS }}
        trusted_public_keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build VM image
      run: nix build .#blocksenseOS-vm -o result-vm

    - name: Test VM configuration
      run: just check

    - name: Build ISO image
      run: nix build .#blocksenseOS-iso -o result-iso

  # Stage 6: Documentation & Reproducibility
  documentation-reproducibility:
    name: Documentation & Reproducibility
    runs-on: ubuntu-latest
    needs: build-matrix
    defaults:
      run:
        shell: "${{ github.workspace }}/scripts/nix-env.sh {0}"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with:
        fetch-depth: 0

    - uses: ./.github/actions/setup-nix
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        substituters: ${{ vars.SUBSTITUTERS }}
        trusted_public_keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

    - name: Generate documentation
      run: just generate-docs

    - name: Test reproducible builds
      # Implementation lives in scripts/check-reproducibility.sh so that this
      # gate and the `just ci-docs-reproducibility` recipe run the same code.
      run: ./scripts/check-reproducibility.sh

    - name: Upload documentation
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: documentation
        path: docs/build/
        retention-days: 30

  # Final Summary Job
  ci-summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: [code-quality, build-matrix, unit-tests, integration-tests, system-tests, documentation-reproducibility]
    if: always()
    steps:
    - name: CI Pipeline Summary
      run: |
        echo "=== BlocksenseOS CI/CD Pipeline Summary ==="
        echo ""
        echo "📊 **Stage Results:**"
        echo "- Code Quality & Security: ${{ needs.code-quality.result }}"
        echo "- Build Matrix: ${{ needs.build-matrix.result }}"
        echo "- Unit Tests: ${{ needs.unit-tests.result }}"
        echo "- Integration Tests: ${{ needs.integration-tests.result }}"
        echo "- System Tests: ${{ needs.system-tests.result }}"
        echo "- Documentation & Reproducibility: ${{ needs.documentation-reproducibility.result }}"
        echo ""
        
        if [[ "${{ needs.code-quality.result }}" == "success" && 
              "${{ needs.build-matrix.result }}" == "success" && 
              "${{ needs.unit-tests.result }}" == "success" && 
              "${{ needs.integration-tests.result }}" == "success" && 
              "${{ needs.system-tests.result }}" == "success" && 
              "${{ needs.documentation-reproducibility.result }}" == "success" ]]; then
          echo "🎉 **Overall Status: SUCCESS** ✅"
        else
          echo "❌ **Overall Status: FAILURE**"
          exit 1
        fi
